services:
  database:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 15
  configserver:
    image: ecommerce/configserver:0.0.1-SNAPSHOT
    build:
      context: ../configserver
      args:
        JAR_FILE: target/configserver-0.0.1-SNAPSHOT.jar
    environment:
      ENCRYPT_KEY: ecommercePhase1ConfigKey
    ports:
      - "8071:8071"
  eurekaserver:
    image: ecommerce/eurekaserver:0.0.1-SNAPSHOT
    build:
      context: ../eurekaserver
      args:
        JAR_FILE: target/eurekaserver-0.0.1-SNAPSHOT.jar
    ports:
      - "8073:8070"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8080
      - --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
    ports:
      - "8080:8080"

  gatewayserver:
    image: ecommerce/gatewayserver:0.0.1-SNAPSHOT
    build:
      context: ../gatewayserver
      args:
        JAR_FILE: target/gatewayserver-0.0.1-SNAPSHOT.jar
    environment: &jwt
      JWT_ISSUER_URI: http://localhost:8080/realms/ecommerce
      JWT_JWK_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
    depends_on: [eurekaserver, keycloak]
    ports:
      - "8072:8072"
  productservice:
    image: ecommerce/productservice:0.0.1-SNAPSHOT
    build:
      context: ../product-service
      args:
        JAR_FILE: target/product-service-0.0.1-SNAPSHOT.jar
    environment:
      <<: *jwt
      INVENTORY_INTERNAL_SECRET: ${INVENTORY_INTERNAL_SECRET:-local-demo-inventory-secret-change-me}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_CONFIG_URI: http://configserver:8071
    depends_on:
      database: {condition: service_healthy}
      configserver: {condition: service_started}
      eurekaserver: {condition: service_started}
  orderservice:
    image: ecommerce/orderservice:0.0.1-SNAPSHOT
    build:
      context: ../order-service
      args:
        JAR_FILE: target/order-service-0.0.1-SNAPSHOT.jar
    environment:
      <<: *jwt
      INVENTORY_INTERNAL_SECRET: ${INVENTORY_INTERNAL_SECRET:-local-demo-inventory-secret-change-me}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_CONFIG_URI: http://configserver:8071
    depends_on:
      database: {condition: service_healthy}
      configserver: {condition: service_started}
      eurekaserver: {condition: service_started}
  customer-service:
    image: ecommerce/customerservice:0.0.1-SNAPSHOT
    build:
      context: ../customer-service
      args:
        JAR_FILE: target/customer-service-0.0.1-SNAPSHOT.jar
    environment:
      <<: *jwt
      INVENTORY_INTERNAL_SECRET: ${INVENTORY_INTERNAL_SECRET:-local-demo-inventory-secret-change-me}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_CONFIG_URI: http://configserver:8071
    depends_on:
      database: {condition: service_healthy}
      configserver: {condition: service_started}
      eurekaserver: {condition: service_started}

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gatewayserver]
    ports:
      - "3000:80"
