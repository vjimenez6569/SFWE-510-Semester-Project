server.port=8083

example.property=I AM THE DEFAULT

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

management.endpoints.web.exposure.include=*
management.endpoints.enabled-by-default=true
# Phase 2 discovery and JWT validation
eureka.client.service-url.defaultZone=http://eurekaserver:8070/eureka/
eureka.instance.prefer-ip-address=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080/realms/ecommerce}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs}
